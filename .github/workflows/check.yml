# 自检 + 产物构建 + 发布
#
# 这是 myPortal 的「同步更新」流水线：
#   push / PR  →  跑 check_demo.py（57 项断言）→ 绿才继续
#              →  构建 docx / pptx 产物
#              →  main 分支则发布到 GitHub Pages（demo 可直接点开看）
#
# 产物构建之所以放这里而不是靠本地跑：Docx/ 与 _ref/ 里的素材变了，
# 上游产物不会自己更新 —— 每次都从源码重建，产物与源码不可能对不上。

name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Demo self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # check_demo.py 只用标准库，不需要装依赖
      - name: Run demo self-check
        run: python tools/check_demo.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      # 33 项断言，覆盖今天实际踩过的坑（display_diagram 的裸 XML、
      # 区域框与标题分离、去重键与唯一约束对齐、zone 归一、
      # critical 只能从数值来、没有数据 ≠ 正常、租户隔离）
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  build-docs:
    name: Build docx / pptx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      # 文档构建脚本会改写 Docx/ 下的产物。跑在 CI 里，产物作为
      # artifact 上传 —— 不直接提交回仓库（否则每次推送都产生一个
      # "更新产物" 的提交，来回触发 CI）。
      - name: Build design doc
        run: python tools/build_design_doc.py

      - name: Build plan doc
        run: python tools/build_plan_doc.py

      # v4+ 的 upload-artifact 不允许同名 artifact 上传两次 ——
      # 本 job 只跑一次，没问题。但 build-docs 与 publish-demo 都写 Docx/
      # 时要注意 artifact 名不要撞。
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: myportal-docs
          path: Docx/
          if-no-files-found: error

  publish-demo:
    name: Publish demo to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build-docs, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # step 级 continue-on-error：Pages 是可选的部署通道，不是质量关卡。
      # 仓库没开 Pages 时（Settings → Pages → Source 选 GitHub Actions），
      # 这一步会失败 —— 但自检、测试、产物构建已经过了，不该因此把整个
      # workflow 判成红灯。红灯的含义是「代码有问题」，不是「没配部署」。
      - uses: actions/configure-pages@v6
        continue-on-error: true
        id: configure_pages

      # 发布的产物：
      #   demo/   —— 演示原型（单文件 HTML，双击就能看）
      #   web/dist/ —— 正式前端（React 构建产物，接真后台）
      #
      # demo/ 直接就是静态目录；web/ 要先构建。两个一起发，
      # 用 /demo/ 与 / 区分入口。
      - name: Build web frontend
        continue-on-error: true
        working-directory: web
        env:
          # Pages 项目站点挂在 /<仓库名>/ 下 —— 构建时的 base 必须跟着变，
          # 否则 index.html 引用 /assets/...，浏览器去域名根找，全 404。
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build

      - name: Assemble publish directory
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p _site/demo
          # 只拷 demo 的 HTML —— 截图与素材不进发布产物：
          #   1) 它们是文档素材，不是运行所需
          #   2) 28 张截图共 9.3MB，会把 artifact 撑大到 9.8MB
          cp demo/index.html _site/demo/
          if [ -d web/dist ]; then
            # 不要 sourcemap —— 生产部署不需要，还占 1.9MB
            #
            # 用 tar 而不是 cp --parents —— 后者会留下 _site/web/dist/… 的嵌套路径。
            # --exclude='*.map' 要放在 -cf 之前、路径之前，否则 GNU tar 会把它
            # 当成要打包的成员名。
            (cd web/dist && tar --exclude='*.map' -cf - .) | (cd _site && tar -xf -)
          fi
          # SPA fallback —— GitHub Pages 找不到路径时返回 404.html，
          # 所以把 index.html 复制成 404.html，深链接（/siem、/monitor）
          # 刷新时才能加载到应用，而不是 GitHub 的 404 页。
          # （实测过：没有它，线上 /siem 直接 404）
          if [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          fi
          du -sh _site
          find _site -type f | head -20

      # Pages 要求 artifact 是「gzip 包着 tar」，且 tar 里不能有硬链接/符号链接。
      # 直接把目录丢给 upload-artifact 会生成 zip —— Pages 的校验器不认，
      # 报的是那句很含糊的：
      #
      #     Artifact could not be deployed. Please ensure the content does
      #     not contain any hard links, symlinks and total size is less
      #     than 10GB.
      #
      # 所以照 upload-pages-artifact 的实现自己做：先 tar 成单文件，再上传。
      # --dereference --hard-dereference 是必须的（把符号链接/硬链接解成普通文件）。
      - name: Archive Pages artifact
        continue-on-error: true
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "_site" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          ls -la "$RUNNER_TEMP/artifact.tar"

      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # 上传与部署之间必须等一下。
      #
      # **这是 GitHub 的 artifact 索引最终一致性问题** —— 实测连续 6 次
      # 部署全部失败，日志是：
      #
      #     Found 2 artifact(s)
      #     Error: No artifacts named "github-pages" were found
      #            for this workflow run.
      #
      # run 里明明有 3 个 artifact（web-dist / myportal-docs /
      # github-pages），github-pages 也存在且未过期 —— 但 deploy-pages
      # 查 metadata 时索引还没刷新，**它不重试，直接失败**。
      #
      # 之前的 `continue-on-error: true` 把这个失败完全吞掉了，
      # 于是 CI 报 success，线上却一直是旧版本 —— 连续 6 次 push
      # 都没真正上线（线上产物停在 15:50）。
      - name: Wait for artifact index
        run: |
          echo "Waiting for the artifact index to catch up..."
          sleep 20

      # 部署失败必须报红。**不能加 continue-on-error** ——
      # 之前就是它让「部署没发生」伪装成「CI 全绿」。
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
