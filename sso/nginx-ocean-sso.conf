# 形态 2：网关做 Cookie 转发（myPortal 为独立主机名时使用）
#
# 优先考虑 README.md 的「形态 1：反向代理同源」—— 那条路对浏览器行为最可预测，
# 也不新增一层信任边界。本文件供 myPortal 无法挂在 oceansite 主机名下时使用。
#
# 关键点：网关摘出 oceansite 的会话 Cookie，改成 X-Ocean-Session 头发给 myPortal 后端。
# 浏览器永远看不到这个头；myPortal 后端也不需要知道 Cookie 名以外的东西。

# ── myPortal 独立主机名 ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name myportal.example.com;

    ssl_certificate     /etc/nginx/certs/myportal.crt;
    ssl_certificate_key /etc/nginx/certs/myportal.key;

    # 不要泄露 myPortal 自己在直连后端时拿到的头
    proxy_set_header X-Ocean-Session "";

    location / {
        proxy_pass         http://127.0.0.1:9102;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ★ 核心：从入站 Cookie 里摘出 oceansite 的会话值，改成头转发
        #   前提：浏览器确实把 Cookie 发到了这个主机名。
        #   若 oceansite 的 Cookie 是 host-only（未设 Domain），
        #   浏览器不会发过来 —— 这种情况请改用形态 1（同源挂载）。
        proxy_set_header   X-Ocean-Session   $http_ocsession;

        # 换票端点要允许携带 Cookie（跨源时前端需 credentials: 'include'）
        proxy_cookie_path  /;
        proxy_pass_header Set-Cookie;
    }

    # 跨源部署时前端在别的源上，需要明确允许携带凭据
    location /api/ {
        proxy_pass         http://127.0.0.1:9102;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Ocean-Session   $http_ocsession;

        add_header Access-Control-Allow-Origin  "https://oceansite.example.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        # ★ 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 600;
            add_header Access-Control-Allow-Origin  "https://oceansite.example.com" always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 204;
        }
    }
}

# ── 形态 1：反向代理同源（推荐）────────────────────────────────────────
# myPortal 挂在 oceansite 的同一主机名下的子路径。
# 浏览器视之为同源，Cookie 自动携带，前端零改造。
server {
    listen 443 ssl http2;
    server_name oceansite.example.com;

    ssl_certificate     /etc/nginx/certs/oceansite.crt;
    ssl_certificate_key /etc/nginx/certs/oceansite.key;

    # oceansite 本体
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # myPortal 挂在 /security/ 下
    location /security/ {
        proxy_pass         http://127.0.0.1:9102/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA 前端路由：回落到 index.html，否则刷新子路由会 404
        proxy_set_header   X-Forwarded-Prefix /security;
        proxy_redirect     off;
    }

    # myPortal 的 API（相对路径 base，SameSite=Strict 的 refresh cookie 才能生效）
    location /security/api/ {
        proxy_pass         http://127.0.0.1:9102/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
    }
}

# ── 通用加固 ────────────────────────────────────────────────────────────
# 这些与 SSO 无关，但同一个网关上加了顺手：
#   · add_header 在有内层 location 声明自己的 add_header 时不会继承 ——
#     下面用 include 片段在每个 location 里显式带上，别只写在 server 块。
#   · 静态资源用精确匹配 location，避免 /security/assets 既是目录又是 SPA 路由。
